<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F97316">
  <title>Family Alerts — Receiver</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="app-title">Family Alerts 📢</h1>
    </header>

    <section id="receiver">
      <h2>Receiving alerts</h2>
      <p id="receiver-hint">Keep this page open (or install it) to receive alerts from the family topic.</p>
      <p id="notify-status" role="status" aria-live="polite"></p>
      <button type="button" id="notify-btn">Enable notification sound</button>
    </section>

    <section id="history-section">
      <h2>Received alerts</h2>
      <ul id="alert-history"></ul>
      <p id="history-empty">No alerts yet.</p>
    </section>
  </main>

  <div id="alert-popup" class="alert-popup" role="alertdialog" aria-labelledby="popup-title" aria-hidden="true" hidden>
    <div>
      <h3 id="popup-title"></h3>
      <p id="popup-message"></p>
      <button type="button" id="popup-close">OK</button>
    </div>
  </div>

  <script type="module" src="receiver.js"></script>
</body>
</html>
